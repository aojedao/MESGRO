  about:
    title: "About MESGRO"
    subtitle: "An open-source portfolio template designed specifically for robotics and mechatronics engineers to showcase their innovative projects."
    what_is: "What is MESGRO?"
    what_is_desc: "MESGRO (Mechatronics Engineering Showcase Gallery for Robotics Operations) is a complete Jekyll template that enables engineers, researchers, and students to create impressive portfolios for their robotics and mechatronics projects."
    what_is_desc2: "Built with modern web technologies and designed with user experience in mind, MESGRO provides everything you need to showcase your technical projects in a professional and effective manner."
    key_features: "Key Features"
    3d_models: "Interactive 3D Model Viewer"
    3d_models_desc: "Display your mechanical designs, prototypes, and 3D-printed parts with an interactive viewer that supports STL, OBJ, GLTF, and GLB formats. Users can rotate, zoom, and explore your designs in detail."
    circuit_schematic: "Circuit Schematic Visualization"
    circuit_schematic_desc: "Showcase your electrical designs with circuit diagrams featuring zoom and pan. Perfect for displaying PCB designs, wiring diagrams, and system architectures."
    code_integration: "Code Integration"
    code_integration_desc: "Present your source code with syntax highlighting, tabbed interfaces, and download links. Supports multiple programming languages including C/C++, Python, Arduino, and more."
    responsive_design: "Responsive Design"
    responsive_design_desc: "Your portfolio looks great on all devices - from desktop computers to mobile phones. Responsive design ensures optimal viewing experience across all screen sizes."
    github_compatible: "GitHub Pages Compatible"
    github_compatible_desc: "Deploy your portfolio for free using GitHub Pages. The template is fully compatible with Jekyll and the GitHub hosting platform."
    customizable_theme: "Customizable Theme"
    customizable_theme_desc: "Dark and light themes with easy customization options. Modify colors, fonts, and layouts to match your personal brand."
    perfect_for: "Perfect For"
    students: "Students"
    students_desc: "Showcase your coursework, final projects, and research work to potential employers and graduate schools."
    engineers: "Engineers"
    engineers_desc: "Display your professional projects, innovations, and technical experience to colleagues and industry peers."
    researchers: "Researchers"
    researchers_desc: "Present your research findings, prototypes, and experimental setups with rich media and detailed documentation."
    makers: "Hobbyists"
    makers_desc: "Share your maker projects, Arduino creations, and DIY robotics builds with the maker community."
    built_with: "Built With"
    getting_started: "Getting Started"
    getting_started_desc: "Ready to create your own robotics portfolio? Get started with MESGRO in just a few steps:"
    fork_repo: "Fork the Repository"
    fork_repo_desc: "Start by forking the MESGRO repository to your GitHub account."
    customize_content: "Customize Your Content"
    customize_content_desc: "Add your projects, update the configuration, and customize the design."
    enable_pages: "Enable GitHub Pages"
    enable_pages_desc: "Activate GitHub Pages in your repository settings to publish your portfolio."
    share_work: "Share Your Work"
    share_work_desc: "Your portfolio is now live and ready to share with the world!"
    start_github: "Get Started on GitHub"
    view_examples: "View Example Projects"
    contribute: "Contribute"
    contribute_desc: "MESGRO is an open-source project and we welcome contributions from the community. Whether you're fixing bugs, adding new features, or improving documentation, your help is appreciated."
    contribute_guide: "Contribution Guide"
