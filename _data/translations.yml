    subtitle: "Una plantilla de portafolio de código abierto diseñada específicamente para ingenieros de robótica y mecatrónica para mostrar sus proyectos innovadores."
    what_is: "¿Qué es MESGRO?"
    what_is_desc: "MESGRO (Mechatronics Engineering Showcase Gallery for Robotics Operations) es una plantilla completa de Jekyll que permite a ingenieros, investigadores y estudiantes crear portafolios impresionantes para sus proyectos de robótica y mecatrónica."
    what_is_desc2: "Construido con tecnologías web modernas y diseñado pensando en la experiencia del usuario, MESGRO proporciona todo lo que necesitas para mostrar tus proyectos técnicos de manera profesional y efectiva."
    key_features: "Características Principales"
    3d_models: "Visor de Modelos 3D Interactivo"
    3d_models_desc: "Muestra tus diseños mecánicos, prototipos y piezas impresas en 3D con un visor interactivo que soporta formatos STL, OBJ, GLTF y GLB. Los usuarios pueden rotar, hacer zoom y explorar tus diseños en detalle."
    circuit_schematic: "Visualización de Esquemas de Circuito"
    circuit_schematic_desc: "Muestra tus diseños eléctricos con diagramas de circuito con zoom y desplazamiento. Perfecto para mostrar diseños de PCB, diagramas de cableado y arquitecturas de sistemas."
    code_integration: "Integración de Código"
    code_integration_desc: "Presenta tu código fuente con resaltado de sintaxis, interfaces con pestañas y enlaces de descarga. Soporta múltiples lenguajes de programación incluyendo C/C++, Python, Arduino y más."
    responsive_design: "Diseño Responsivo"
    responsive_design_desc: "Tu portafolio se ve excelente en todos los dispositivos - desde computadoras de escritorio hasta teléfonos móviles. El diseño responsivo asegura una experiencia de visualización óptima en todos los tamaños de pantalla."
    github_compatible: "Compatible con GitHub Pages"
    github_compatible_desc: "Despliega tu portafolio gratis usando GitHub Pages. La plantilla es completamente compatible con Jekyll y la plataforma de alojamiento de GitHub."
    customizable_theme: "Tema Personalizable"
    customizable_theme_desc: "Temas oscuros y claros con opciones de personalización fáciles. Modifica colores, fuentes y diseños para que coincidan con tu marca personal."
    perfect_for: "Perfecto Para"
    students: "Estudiantes"
    students_desc: "Muestra tu trabajo de curso, proyectos finales y trabajo de investigación a potenciales empleadores y escuelas de posgrado."
    engineers: "Ingenieros"
    engineers_desc: "Exhibe tus proyectos profesionales, innovaciones y experiencia técnica a colegas y compañeros de la industria."
    researchers: "Investigadores"
    researchers_desc: "Presenta tus hallazgos de investigación, prototipos y configuraciones experimentales con medios enriquecidos y documentación detallada."
    makers: "Aficionados"
    makers_desc: "Comparte tus proyectos maker, creaciones de Arduino y construcciones de robótica DIY con la comunidad maker."
    built_with: "Construido Con"
    getting_started: "Comenzar"
    getting_started_desc: "¿Listo para crear tu propio portafolio de robótica? Comienza con MESGRO en solo unos pasos:"
    fork_repo: "Haz Fork del Repositorio"
    fork_repo_desc: "Comienza haciendo fork del repositorio MESGRO a tu cuenta de GitHub."
    customize_content: "Personaliza tu Contenido"
    customize_content_desc: "Agrega tus proyectos, actualiza la configuración y personaliza el diseño."
    enable_pages: "Habilita GitHub Pages"
    enable_pages_desc: "Activa GitHub Pages en la configuración de tu repositorio para publicar tu portafolio."
    share_work: "Comparte tu Trabajo"
    share_work_desc: "¡Tu portafolio ahora está en vivo y listo para compartir con el mundo!"
    start_github: "Comenzar en GitHub"
    view_examples: "Ver Proyectos de Ejemplo"
    contribute: "Contribuir"
    contribute_desc: "MESGRO es un proyecto de código abierto y damos la bienvenida a contribuciones de la comunidad. Ya sea que estés corrigiendo errores, agregando nuevas características o mejorando la documentación, tu ayuda es apreciada."
    contribute_guide: "Guía de Contribución"
